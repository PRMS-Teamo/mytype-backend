# Redis 설정 파일
# 기본 설정

# 네트워크 설정
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# 메모리 설정
maxmemory 256mb
maxmemory-policy allkeys-lru

# 로깅 설정
loglevel notice
logfile ""

# 데이터 지속성 설정
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# 보안 설정
# requirepass your_redis_password_here

# 인증용 비밀번호 (선택사항이지만 개발/테스트 시 권장)
requirepass teamo

# RDB persistence 비활성화 (개발용)
save ""

# AOF 비활성화
appendonly no

# 메모리 부족 시 동작 방식 (eviction policy)
maxmemory-policy allkeys-lru

# 성능 설정
tcp-backlog 511
databases 16
